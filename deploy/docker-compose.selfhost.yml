# docs.quoc.app self-host on ProDesk — fork of CasualOffice/docs.
#
# Same topology as deploy/docker-compose.prod.yml but cloudflared replaces
# Caddy: Cloudflare edge terminates TLS, the dedicated tunnel
# (cloudflared-docs.service, docs-production.yml) proxies
# docs.quoc.app -> http://127.0.0.1:8080 on the host.
#
#   docker compose -f deploy/docker-compose.selfhost.yml up -d --build
#
# Fork-specific file (not upstream): kept untracked so upstream merges stay clean.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: casual-editor:docs-quoc-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      # Prod mode: server refuses in-memory Y.Doc storage, so REDIS_URL below
      # is mandatory. Redis snapshots preserve Y.Doc updates, but the current
      # anonymous share-room registry and uploaded DOCX seed stay in process
      # memory; share links do NOT survive an app restart. See deploy/README.md.
      NODE_ENV: "production"
      # Client IP arrives via cloudflared's X-Forwarded-For; trust it so
      # rate limiting keys on the real client.
      TRUST_PROXY: "true"
      CASUAL_FILE_EXT: ".docx"
      CASUAL_STORAGE: "local"
      CASUAL_LOCAL_PATH: "/data"
      REDIS_URL: "redis://redis:6379"
      CASUAL_REDIS_PREFIX: "casual-docs:room:"
    volumes:
      - ../data/collab:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist the RDB so a redis restart doesn't drop rooms either.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
