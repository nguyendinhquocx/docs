# docs.quoc.app self-host on ProDesk — fork of CasualOffice/docs.
#
# Same topology as deploy/docker-compose.prod.yml but cloudflared replaces
# Caddy: Cloudflare edge terminates TLS, the dedicated tunnel
# (cloudflared-docs.service, docs-production.yml) proxies
# docs.quoc.app -> http://127.0.0.1:8080 on the host.
#
#   docker compose -f deploy/docker-compose.selfhost.yml up -d --build
#
# Fork-specific owner workspace config. No account identity, Access AUD, or signing secret is stored here.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: casual-editor:docs-quoc-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      CASUAL_FILE_EXT: ".docx"
      CASUAL_STORAGE: "local"
      CASUAL_LOCAL_PATH: "/data"
      CASUAL_PERSONAL_MODE: "single"
      CASUAL_SESSION_TTL_DAYS: "45"
      REDIS_URL: "redis://redis:6379"
      CASUAL_REDIS_PREFIX: "casual-docs:room:"
      # Runtime-only values are provisioned on ProDesk, never committed.
      CF_OWNER_HOST: "docs.quoc.app"
      CF_GUEST_HOST: "docx.quoc.app"
      GUEST_PUBLIC_ORIGIN: "https://docx.quoc.app"
      CORS_ORIGINS: "https://docs.quoc.app,https://docx.quoc.app"
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM:?set the Cloudflare Access team domain in ProDesk runtime env}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?set the owner Access application AUD in ProDesk runtime env}
      CF_ACCESS_IDENTITIES: ${CF_ACCESS_IDENTITIES:?set the owner identity allowlist in ProDesk runtime env}
      COLLAB_ROOM_TOKEN_SECRET: ${COLLAB_ROOM_TOKEN_SECRET:?set a random secret in ProDesk runtime env}
    volumes:
      - ../data/collab:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist the RDB so a redis restart doesn't drop rooms either.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
